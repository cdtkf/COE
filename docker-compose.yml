services:
  postgres: 
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=coe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      -  "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d coe"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
